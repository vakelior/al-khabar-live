name: live-site

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  serve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: start http server
        run: |
          cd site
          nohup python3 -m http.server 8080 > /tmp/http.log 2>&1 &
          echo "http server started on port 8080"

      - name: open public link (cloudflare)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:8080 > /tmp/cf.log 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -n1)
            [ -n "$URL" ] && break
            sleep 3
          done
          echo "URL : $URL"
          if [ -z "$URL" ]; then
            echo "--- cloudflared log ---"
            cat /tmp/cf.log
          fi

      - name: keep alive
        run: |
          for i in $(seq 1 4); do sleep 60; done
