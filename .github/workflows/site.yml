name: live-site

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  serve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: install server
        run: |
          sudo apt update -y
          sudo apt install -y curl sshpass

      - name: start http server
        run: |
          cd site
          nohup python3 -m http.server 8080 > /tmp/http.log 2>&1 &
          echo "http server started on port 8080"

      - name: open public link
        run: |
          echo "Opening public link (works in browser)..."
          sshpass -p '' ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R al-khabar-live:80:localhost:8080 serveo.net > /tmp/serveo.log 2>&1 &
          sleep 15
          echo "=========================================="
          echo "LIVE SITE CONNECTION INFO"
          echo "=========================================="
          echo "URL : http://al-khabar-live.serveo.net"
          echo "=========================================="
          echo ""
          echo "serveo log (if any):"
          cat /tmp/serveo.log

      - name: keep alive
        run: |
          for i in $(seq 1 350); do sleep 60; done
